
# mcp-browser aktiv: der mcp-server laeuft auf der VPS und besitzt den UDS.
# Die lokale Browser-Extension erreicht ihn ueber einen SSH-Tunnel
# (lokal: Dienst dsh-browser-tunnel.service) auf denselben Socket-Pfad.
# DSH_CHROME_SOCKET ist bewusst auf $HOME gepinnt, nicht auf /run/user/<uid>:
# dsh-web.service erbt kein XDG_RUNTIME_DIR, und ohne aktives Linger raeumt
# systemd das Runtime-Verzeichnis weg, sobald die letzte Session des Users
# endet. Der laufende mcp-server lauscht danach auf einem geloeschten Inode
# und ist ueber den Tunnel nicht mehr erreichbar (Vorfall 2026-10-02).
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: /usr/bin/node
        args:
          - /home/dsh/dsh-chrome-extension/packages/mcp-server/dist/index.js
        env:
          DSH_CHROME_SOCKET: /home/dsh/.local/state/dsh-chrome/bridge.sock
        toolCallTimeoutMs: 120000
        reconnect:
          enabled: true
